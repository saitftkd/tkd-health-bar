<!DOCTYPE html>
<html>
<head>
  <title>TKD Health Bar Controller</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: gold;
    }

    .section {
      margin: 20px auto;
      padding: 20px;
      border: 2px solid white;
      border-radius: 12px;
      max-width: 420px;
    }

    button {
      font-size: 20px;
      padding: 15px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 180px;
      font-weight: bold;
    }

    .red {
      background: #ff3333;
      color: white;
    }

    .blue {
      background: #3399ff;
      color: white;
    }

    .undo {
      background: orange;
      color: black;
    }

    .reset {
      background: limegreen;
      color: black;
    }

    .ko {
      background: gold;
      color: black;
    }
  </style>
</head>
<body>

<h1>TKD Arcade Controller</h1>

<div class="section">
  <h2>Red Scores</h2>
  <p>Blue health will drop</p>
  <button class="red" onclick="scoreRed(5)">Red +5</button>
  <button class="red" onclick="scoreRed(10)">Red +10</button>
  <button class="red" onclick="scoreRed(15)">Red +15</button>
</div>

<div class="section">
  <h2>Blue Scores</h2>
  <p>Red health will drop</p>
  <button class="blue" onclick="scoreBlue(5)">Blue +5</button>
  <button class="blue" onclick="scoreBlue(10)">Blue +10</button>
  <button class="blue" onclick="scoreBlue(15)">Blue +15</button>
</div>

<div class="section">
  <button class="undo" onclick="undo()">UNDO</button>
  <button class="reset" onclick="resetGame()">RESET</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCM0vaOpikhl3LmEGQVx-6sGgyq_XvIz-g",
  authDomain: "taekwondo-projectx.firebaseapp.com",
  databaseURL: "https://taekwondo-projectx-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "taekwondo-projectx",
  storageBucket: "taekwondo-projectx.firebasestorage.app",
  messagingSenderId: "538355822474",
  appId: "1:538355822474:web:253c1bf7092207d6b2a273",
  measurementId: "G-Z3WF3BM6PE"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const gameRef = ref(db, "tkdGame");

  async function getGame() {
    const snapshot = await get(gameRef);
    return snapshot.val() || {
      redHealth: 100,
      blueHealth: 100,
      history: []
    };
  }

  async function saveGame(game) {
    await set(gameRef, game);
  }

  window.scoreRed = async function(points) {
    const game = await getGame();

    game.history = game.history || [];
    game.history.push({
      redHealth: game.redHealth,
      blueHealth: game.blueHealth
    });

    game.blueHealth = Math.max(0, game.blueHealth - points);

    await saveGame(game);
  }

  window.scoreBlue = async function(points) {
    const game = await getGame();

    game.history = game.history || [];
    game.history.push({
      redHealth: game.redHealth,
      blueHealth: game.blueHealth
    });

    game.redHealth = Math.max(0, game.redHealth - points);

    await saveGame(game);
  }

  window.undo = async function() {
    const game = await getGame();

    if (!game.history || game.history.length === 0) {
      alert("Nothing to undo");
      return;
    }

    const lastState = game.history.pop();

    game.redHealth = lastState.redHealth;
    game.blueHealth = lastState.blueHealth;

    await saveGame(game);
  }

  window.resetGame = async function() {
    await saveGame({
      redHealth: 100,
      blueHealth: 100,
      history: []
    });
  }
</script>

</body>
</html>
