<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TKD Health Bar Controller</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      color: gold;
    }

    .section {
      margin: 20px auto;
      padding: 20px;
      border: 2px solid white;
      border-radius: 12px;
      max-width: 420px;
    }

    button {
      font-size: 20px;
      padding: 15px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 180px;
      font-weight: bold;
    }

    /* Fixed colours */
    .red {
      background: #ff3333;
      color: white;
    }

    .blue {
      background: #3399ff;
      color: white;
    }

    .undo {
      background: orange;
      color: black;
    }

    .reset {
      background: limegreen;
      color: black;
    }

    .ko {
      background: gold;
      color: black;
    }

    /* New sparring section */
    .sparring-section {
      margin: 20px auto;
      padding: 0;
      border: 2px solid white;
      border-radius: 12px;
      max-width: 420px;
      overflow: hidden;
    }

    .sparring-buttons {
      display: flex;
      width: 100%;
      height: 45vh;
    }

    .sparring-button {
      width: 50%;
      height: 100%;
      margin: 0;
      border-radius: 0;
      font-size: 26px;
      font-weight: bold;
      padding: 10px;
    }

    .sparring-red {
      background: #ff3333;
      color: white;
    }

    .sparring-blue {
      background: #3399ff;
      color: white;
    }
  </style>
</head>
<body>

<h1>Health Bar Controller -- RING 1</h1>

<!-- TOP SECTION: PATTERNS -->
<div class="section">
  <h2>PATTERNS SCORING</h2>
  <p>Use this section for Patterns</p>
</div>

<div class="section">
  <h2>BLUE CONTROLS</h2>
  <p>Blue health will be controlled</p>
  <button class="blue" onclick="scoreRed(+1)">Blue -1</button>
  <button class="blue" onclick="scoreRed(-1)">Blue +1</button>
</div>

<div class="section">
  <h2>RED CONTROLS</h2>
  <p>Red health will be controlled</p>
  <button class="red" onclick="scoreBlue(+1)">Red -1</button>
  <button class="red" onclick="scoreBlue(-1)">Red +1</button>
</div>

<!-- SECOND SECTION: SPARRING -->
<div class="sparring-section">
  <h2>SPARRING SCORING</h2>
  <p>Tap the attacking side</p>

  <div class="sparring-buttons">
    <button class="sparring-button sparring-red" onclick="scoreRed(+1)">
      RED<br>SCORE<br><br>Blue -1
    </button>

    <button class="sparring-button sparring-blue" onclick="scoreBlue(+1)">
      BLUE<br>SCORE<br><br>Red -1
    </button>
  </div>
</div>

<div class="section">
  <button class="undo" onclick="undo()">UNDO</button>
  <button class="reset" onclick="resetGame()">RESET</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCM0vaOpikhl3LmEGQVx-6sGgyq_XvIz-g",
  authDomain: "taekwondo-projectx.firebaseapp.com",
  databaseURL: "https://taekwondo-projectx-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "taekwondo-projectx",
  storageBucket: "taekwondo-projectx.firebasestorage.app",
  messagingSenderId: "538355822474",
  appId: "1:538355822474:web:253c1bf7092207d6b2a273",
  measurementId: "G-Z3WF3BM6PE"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const gameRef = ref(db, "tkdGame");

  async function getGame() {
    const snapshot = await get(gameRef);
    return snapshot.val() || {
      redHealth: 100,
      blueHealth: 100,
      history: []
    };
  }

  async function saveGame(game) {
    await set(gameRef, game);
  }

  window.scoreRed = async function(points) {
    const game = await getGame();

    game.history = game.history || [];
    game.history.push({
      redHealth: game.redHealth,
      blueHealth: game.blueHealth
    });

    game.blueHealth = Math.max(0, game.blueHealth - points);

    await saveGame(game);
  }

  window.scoreBlue = async function(points) {
    const game = await getGame();

    game.history = game.history || [];
    game.history.push({
      redHealth: game.redHealth,
      blueHealth: game.blueHealth
    });

    game.redHealth = Math.max(0, game.redHealth - points);

    await saveGame(game);
  }

  window.undo = async function() {
    const game = await getGame();

    if (!game.history || game.history.length === 0) {
      alert("Nothing to undo");
      return;
    }

    const lastState = game.history.pop();

    game.redHealth = lastState.redHealth;
    game.blueHealth = lastState.blueHealth;

    await saveGame(game);
  }

  window.resetGame = async function() {
    await saveGame({
      redHealth: 100,
      blueHealth: 100,
      history: []
    });
  }
</script>

</body>
</html>
