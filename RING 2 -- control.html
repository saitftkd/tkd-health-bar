<!DOCTYPE html>
<html>
<head>
  <title>TKD Health Bar Controller</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: gold;
    }

    .section {
      margin: 20px auto;
      padding: 20px;
      border: 2px solid white;
      border-radius: 12px;
      max-width: 420px;
    }

    button {
      font-size: 20px;
      padding: 15px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 180px;
      font-weight: bold;
    }

    .red {
      background: #3399ff;
      color: white;
    }

    .blue {
      background: #ff3333;
      color: white;
    }

    .undo {
      background: orange;
      color: black;
    }

    .reset {
      background: limegreen;
      color: black;
    }

    .ko {
      background: gold;
      color: black;
    }
  </style>
</head>
<body>

<h1>TKD Arcade Controller</h1>

<div class="section">
  <h2>BLUE CONTROLS</h2>
  <p>Blue health will be controled</p>
  <button class="red" onclick="scoreRed(+1)">Blue -1</button>
  <button class="red" onclick="scoreRed(-1)">Blue +1</button>
</div>

<div class="section">
  <h2>RED CONTROLS</h2>
  <p>Red health will be controled</p>
  <button class="blue" onclick="scoreBlue(+1)">Red -1</button>
  <button class="blue" onclick="scoreBlue(-1)">Red +1</button>
</div>

<div class="section">
  <button class="undo" onclick="undo()">UNDO</button>
  <button class="reset" onclick="resetGame()">RESET</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0Ad0gBSDnJ3EFQw0CqJIPsI5rPwSJE1Q",
  authDomain: "taekwondo-healthbar.firebaseapp.com",
  databaseURL: "https://taekwondo-healthbar-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "taekwondo-healthbar",
  storageBucket: "taekwondo-healthbar.firebasestorage.app",
  messagingSenderId: "699769006350",
  appId: "1:699769006350:web:5f4c0c6fe6a06f6ffe4f5f",
  measurementId: "G-LM3L9Y2NWP"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const gameRef = ref(db, "tkdGame");

  async function getGame() {
    const snapshot = await get(gameRef);
    return snapshot.val() || {
      redHealth: 100,
      blueHealth: 100,
      history: []
    };
  }

  async function saveGame(game) {
    await set(gameRef, game);
  }

  window.scoreRed = async function(points) {
    const game = await getGame();

    game.history = game.history || [];
    game.history.push({
      redHealth: game.redHealth,
      blueHealth: game.blueHealth
    });

    game.blueHealth = Math.max(0, game.blueHealth - points);

    await saveGame(game);
  }

  window.scoreBlue = async function(points) {
    const game = await getGame();

    game.history = game.history || [];
    game.history.push({
      redHealth: game.redHealth,
      blueHealth: game.blueHealth
    });

    game.redHealth = Math.max(0, game.redHealth - points);

    await saveGame(game);
  }

  window.undo = async function() {
    const game = await getGame();

    if (!game.history || game.history.length === 0) {
      alert("Nothing to undo");
      return;
    }

    const lastState = game.history.pop();

    game.redHealth = lastState.redHealth;
    game.blueHealth = lastState.blueHealth;

    await saveGame(game);
  }

  window.resetGame = async function() {
    await saveGame({
      redHealth: 100,
      blueHealth: 100,
      history: []
    });
  }
</script>

</body>
</html>
